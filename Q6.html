<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Product Name: 
    <input id="pn" type="text"> <br>
    Price:
    <input id="p" type="text"><br>
    Quantity:
    <input type="text" name="" id="q"><br>
    <button id="b" type="submit">Submit</button>
    <script>
        const b = document.getElementById("b")
        b.addEventListener("click",()=>{
            const pname = document.getElementById("pn").value
            const pnameReg = /^[A-Za-z]+$/
            const price = document.getElementById("p").value
            const quantity = document.getElementById("q").value
            const quantityReg = /^[0-9]+$/

            if (!pnameReg.test(pname)) {
                alert("Enter valid name")
            } else if(price <= 0) {
                alert("Price must be > 0")
            }
            else if(!quantityReg.test(quantity)) {
                alert("Quantity must be in digits")
            }
            else {
                alert("OK")
            }
            const products ={
                pname,
                price,
                quantity
            }
            localStorage.setItem("data",JSON.stringify(products))


        })
    </script>
</body>
</html>
