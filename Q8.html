<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: white;
            color: black;
        }
        .dark{
            background: black;
            color: white;
        }
        #icon{
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 100px;
        }
    </style>
</head>
<body>
    <span id="icon" onclick="toggle()">😎</span>
    <script>
        function toggle() {
            document.body.classList.toggle("dark");
        }
    </script>
</body>
</html>
